 (x.veh||[]).forEach(v=>{const i=dd(v.ins.end);if(i<0)add('bd','تأمين المركبة '+v.p+' منتهٍ منذ '+(-i)+' يوم','هيئة التأمين');else if(i<=30)add('wr','تأمين المركبة '+v.p+' ينتهي خلال '+i+' يوم','هيئة التأمين');if(dd(v.reg)<0)add('bd','استمارة المركبة '+v.p+' منتهية','المرور')});

 const o={bd:0,wr:1};return A.sort((p,q)=>o[p.s]-o[q.s])}

 +`<div class="card"><div class="row">${logo('moc',26)}<h3 style="margin:0">أنشطة السجل التجاري</h3></div>${x.acts.length?`<div class="sx"><table><tr><th>النشاط</th><th>حالته في السجل</th><th>الترخيص البلدي</th><th>الإجراء</th></tr>${x.acts.map(t=>`<tr><td>${t.n}</td><td><span class="tag ok">${t.st}</span></td><td><span class="tag ${t.l==='مرخص'?'ok':'wr'}">${t.l}</span></td><td>${t.l==='مرخص'?'—':'استخراج ترخيص للنشاط أو تعديله في السجل'}</td></tr>`).join('')}</table></div>`:'<p class="mute">لا توجد أنشطة.</p>'}</div>`
 +`<div class="card"><div class="row">${logo('qiwa',26)}<h3 style="margin:0">عقود الموظفين (منصة قوى)</h3><span class="tag ${nd===x.ct.length?'ok':'wr'}">${nd} من ${x.ct.length} موثقة</span></div>${x.ct.length?`<div class="sx"><table><tr><th>الوظيفة</th><th>رقم العقد</th><th>الحالة في قوى</th><th>ينتهي</th></tr>${x.ct.map(c=>`<tr><td>${c.r}</td><td dir="ltr">${c.id}</td><td><span class="tag ${cs(c.st)}">${c.st}</span></td><td>${c.end}</td></tr>`).join('')}</table></div>`:'<p class="mute">لا توجد عقود مسجلة.</p>'}<p class="mute" style="margin-top:6px">بيانات تجريبية بدون أسماء أو هويات.</p></div>`
 +`<div class="card"><div class="row">${logo('traffic',26)}${logo('ins',26)}<h3 style="margin:0">المركبات التابعة للمنشأة وتأمينها</h3></div>${x.veh.length?`<div class="sx"><table><tr><th>اللوحة</th><th>النوع</th><th>الاستمارة</th><th>التأمين</th><th>ينتهي</th></tr>${x.veh.map(c=>{const r=vd(dd(c.reg)),i=vd(dd(c.ins.end));return `<tr><td>${c.p}</td><td>${c.t}</td><td><span class="tag ${r[1]}">${r[0]}</span></td><td>${c.ins.ty} <span class="tag ${i[1]}">${i[0]}</span></td><td>${c.ins.end}</td></tr>`}).join('')}</table></div>`:'<p class="mute">لا توجد مركبات مسجلة للمنشأة.</p>'}</div>`}
function payOpen(i){const L=pay(PE),S=i<0?L:[L[i]];if(!S.length||!S[0])return;const tot=S.reduce((q,p)=>q+p.amt,0);

 $('#pgo').onclick=()=>{$('#pgo').disabled=true;$('#pgo').textContent='جاري المعالجة...';setTimeout(()=>{const m=document.querySelector('input[name=pmth]:checked').value,ref='PAY-'+Math.random().toString(36).slice(2,8).toUpperCase();
